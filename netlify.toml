[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"

# Security headers (audit S3). Netlify applies these to static files only; pages served by the
# Next.js runtime get the same headers from next.config.js. Keep both lists identical.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# Let browsers keep photos for 30 days (audit P4). When you replace a photo, give it a new file name.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
