<!doctype html>
<!-- Netlify Forms registration (Next.js runtime v5). Netlify detects forms only in static HTML, so every
     form and every field name used by components/ContactForm.js must be declared here.
     The component POSTs to /__forms.html. People never see this file. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>Forms</title>
  </head>
  <body>
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input name="bot-field" />
      <input name="name" />
      <input name="phone" />
      <input name="email" />
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
