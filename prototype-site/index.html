<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rani Ortho Care Prototype</title>
  <meta name="claude:viewport-fit-sides" content="cover">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="img/mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700;800&family=Noto+Sans+Tamil:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    /* Prototype sections 1-3, styled with the Rani Ortho Care design system v1.1 (DESIGN.md).
       Layout: full-width bands, alternating white and sky, content in a 1200px column. One light theme by design. */
    :root {
      color-scheme: light;
      --navy: #14234A; --blue: #3C59A8; --blue-deep: #2A4590; --green: #1B7030; --green-hover: #155A26; --spine: #3DB54A;
      --ink: #14234A; --body: #25304A; --muted: #46526B; --white: #FFFFFF;
      --band-sky: #E8F0FA; --band-green: #EAF5EC; --blue-tint: #EEF3FB; --green-tint: #E8F6EA;
      --line: #D5DDEA; --line-strong: #7D8BA6; --on-navy: #C9D6F2; --amber-bg: #FFF4DF; --amber-text: #8A4B00;
      --font: "Atkinson Hyperlegible Next", "Noto Sans Tamil", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --fs-h1: 28px; --fs-h2: 24px; --fs-h3: 21px; --fs-h4: 19px; --fs-lead: 19px; --fs-body: 18px; --fs-small: 16px; --fs-btn: 18px;
      --gutter: 16px; --section: 56px; --gap: 16px; --pad: 20px; --lh: 1.65; --lh-h: 1.25;
    }
    :root[lang="ta"] { --font: "Noto Sans Tamil", "Atkinson Hyperlegible Next", "Latha", "Nirmala UI", sans-serif; --lh: 1.85; --lh-h: 1.5; }
    @media (min-width: 400px) { :root { --gutter: 20px; } }
    @media (min-width: 640px) { :root { --fs-h1: 34px; --fs-h2: 28px; --fs-h3: 23px; --fs-h4: 20px; --fs-lead: 20px; --gutter: 32px; --section: 72px; --gap: 24px; --pad: 24px; } }
    @media (min-width: 1024px) { :root { --fs-h1: 40px; --fs-h2: 32px; --fs-h3: 26px; --fs-h4: 22px; --fs-lead: 21px; --fs-body: 20px; --fs-small: 17px; --fs-btn: 19px; --gutter: 40px; --section: 96px; --pad: 32px; } }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } *, *::before, *::after { transition: none !important; animation: none !important; } }
    body { margin: 0; font-family: var(--font); font-size: var(--fs-body); color: var(--body); background: var(--white); line-height: var(--lh); -webkit-font-smoothing: antialiased; }
    body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--white); }
    img { max-width: 100%; display: block; }
    a { color: var(--blue-deep); text-underline-offset: 3px; }
    :focus-visible { outline: 3px solid var(--navy); outline-offset: 2px; box-shadow: 0 0 0 2px var(--white); border-radius: 6px; }
    .wrap { max-width: 1200px; margin: 0 auto; padding-left: max(var(--gutter), env(safe-area-inset-left, 0px)); padding-right: max(var(--gutter), env(safe-area-inset-right, 0px)); }
    .skip { position: absolute; left: -999px; top: 8px; background: var(--navy); color: var(--white); padding: 8px 14px; border-radius: 8px; z-index: 100; }
    .skip:focus { left: 8px; }
    .tam { font-family: "Noto Sans Tamil", var(--font); }

    .notice { background: var(--navy); color: var(--on-navy); font-size: 16px; }
    .notice .wrap { display: flex; gap: 10px; align-items: center; justify-content: center; padding-block: 8px; text-align: center; flex-wrap: wrap; }
    .pill { display: inline-block; background: var(--spine); color: var(--navy); font-weight: 700; font-size: 14px; letter-spacing: .04em; padding: 2px 10px; border-radius: 999px; }

    header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: var(--white); border-bottom: 1px solid var(--line); box-shadow: 0 2px 10px rgba(20, 35, 74, .06); }
    header.top .wrap { display: flex; align-items: center; gap: 16px; min-height: 76px; padding-block: 8px; }
    .brand { display: flex; align-items: center; flex-shrink: 0; }
    .brand img { height: 40px; width: auto; }
    @media (min-width: 1024px) { .brand img { height: 46px; } }
    nav.tabs { display: flex; gap: 4px; margin-left: auto; }
    nav.tabs a { display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 12px; border-radius: 12px; text-decoration: none; color: var(--body); font-weight: 700; font-size: 17px; white-space: nowrap; }
    nav.tabs a .n { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--blue-tint); color: var(--blue-deep); font-size: 14px; font-weight: 700; }
    nav.tabs a:hover { background: var(--blue-tint); color: var(--blue-deep); }
    nav.tabs a[aria-current="page"] { background: var(--navy); color: var(--white); }
    nav.tabs a[aria-current="page"] .n { background: var(--white); color: var(--navy); }
    .lang { display: flex; border: 2px solid var(--navy); border-radius: 12px; overflow: hidden; flex-shrink: 0; }
    .lang button { min-height: 44px; min-width: 56px; padding: 0 12px; border: 0; background: var(--white); font: 700 17px var(--font); color: var(--navy); cursor: pointer; }
    .lang button + button { border-left: 2px solid var(--navy); }
    .lang button[aria-pressed="true"] { background: var(--navy); color: var(--white); }

    .pagehead { background: radial-gradient(40% 70% at 85% 30%, rgba(61, 181, 74, .14), transparent 70%), radial-gradient(35% 60% at 65% 90%, rgba(60, 89, 168, .12), transparent 70%), linear-gradient(180deg, var(--blue-tint), var(--white)); border-bottom: 1px solid var(--line); }
    .pagehead .wrap { padding-block: var(--section) calc(var(--section) - 16px); display: grid; gap: 12px; }
    .eyebrow { display: inline-flex; gap: 10px; align-items: center; font-size: 16px; font-weight: 700; letter-spacing: .04em; color: var(--blue-deep); }
    :root[lang="ta"] .eyebrow { letter-spacing: 0; }
    .eyebrow::before { content: ""; width: 24px; height: 4px; background: var(--spine); border-radius: 2px; }
    .pagehead h1 { font-size: var(--fs-h1); line-height: var(--lh-h); margin: 0; color: var(--ink); font-weight: 700; text-wrap: balance; }
    .pagehead p.lead { font-size: var(--fs-lead); max-width: 68ch; margin: 0; color: var(--body); line-height: 1.6; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .chip { background: var(--white); border: 1px solid var(--line); color: var(--blue-deep); padding: 6px 14px; border-radius: 999px; font-size: 16px; font-weight: 700; }

    /* Bands: each section is full width; content is held to 1200px by padding. */
    main { display: block; }
    section.block { margin: 0; padding-block: var(--section); padding-left: max(var(--gutter), calc((100% - 1200px) / 2 + var(--gutter))); padding-right: max(var(--gutter), calc((100% - 1200px) / 2 + var(--gutter))); }
    [data-view] > section.block:nth-of-type(even) { background: var(--band-sky); }
    [data-view] > .quote { margin: 0; border-radius: 0; border: 0; border-top: 6px solid var(--spine); }
    h2, h3, .chip, .tags li, .services li, .online .v { overflow-wrap: anywhere; }
    h2 { font-size: var(--fs-h2); line-height: var(--lh-h); color: var(--ink); margin: 0 0 8px; font-weight: 700; text-wrap: balance; }
    .sub { color: var(--muted); margin: 0 0 calc(var(--gap) + 4px); font-size: var(--fs-lead); }
    h3 { font-size: var(--fs-h3); color: var(--ink); margin: 0 0 6px; line-height: var(--lh-h); text-wrap: balance; }
    .card { background: var(--white); border: 1px solid var(--line); border-radius: 16px; padding: var(--pad); box-shadow: 0 1px 2px rgba(20, 35, 74, .05), 0 4px 12px rgba(20, 35, 74, .05); }
    .grid { display: grid; gap: var(--gap); }
    .grid > * { min-width: 0; }
    .g2, .g3, .g4 { grid-template-columns: 1fr; }
    @media (min-width: 640px) { .g2, .g3, .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (min-width: 1024px) { .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
    .label { font-size: 16px; font-weight: 700; color: var(--muted); margin: 0 0 4px; }

    .doctor { display: grid; gap: 24px; }
    @media (min-width: 640px) { .doctor { grid-template-columns: 200px 1fr; align-items: center; } }
    .portrait { aspect-ratio: 4/5; max-width: 200px; border-radius: 16px; background: var(--blue-tint); border: 2px dashed var(--blue); display: grid; place-items: center; text-align: center; color: var(--blue-deep); font-weight: 700; font-size: 16px; padding: 16px; }
    .portrait img { width: 64px; margin: 0 auto 10px; }
    .doctor h3 { font-size: var(--fs-h2); margin-bottom: 2px; }
    .quals { color: var(--blue-deep); font-weight: 700; margin: 0 0 12px; }
    .tags { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 14px; padding: 0; list-style: none; }
    .tags li { background: var(--blue-tint); color: var(--blue-deep); padding: 6px 14px; border-radius: 999px; font-size: 16px; font-weight: 700; }
    .callout { border-left: 6px solid var(--spine); background: var(--green-tint); padding: 14px 18px; border-radius: 0 12px 12px 0; color: var(--ink); margin: 14px 0 0; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 18px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 56px; padding: 10px 24px; border-radius: 12px; font-weight: 700; text-decoration: none; font-size: var(--fs-btn); line-height: 1.25; border: 2px solid transparent; }
    .btn { transition: transform .2s ease, box-shadow .2s ease, background-color .2s ease; }
    .btn-primary { background: var(--green); background-image: linear-gradient(180deg, #228639 0%, #1B7030 100%); color: var(--white); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .28), 0 6px 16px rgba(27, 112, 48, .28); }
    .btn-primary:hover { background-image: linear-gradient(180deg, #1F7D36 0%, #155A26 100%); transform: translateY(-2px); }
    .btn:active { transform: scale(.98); }
    .btn-ghost { background: var(--white); color: var(--blue-deep); border-color: var(--blue-deep); }
    .btn-ghost:hover { background: var(--blue-tint); }
    .btn svg { width: 24px; height: 24px; }
    @media (max-width: 639px) { .actions .btn { width: 100%; } }
    .kv { display: grid; gap: 18px; }
    .kv .row { display: grid; grid-template-columns: 48px 1fr; gap: 14px; align-items: start; }
    .ico { width: 48px; height: 48px; border-radius: 50%; background: var(--blue-tint); color: var(--blue); display: grid; place-items: center; }
    .ico svg { width: 24px; height: 24px; }
    .kv .v { color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; }
    .kv .v a { color: var(--ink); text-decoration: none; }
    .kv .v a:hover { color: var(--blue-deep); text-decoration: underline; }
    table.hours { width: 100%; border-collapse: collapse; }
    table.hours td { padding: 12px 0; border-bottom: 1px solid var(--line); }
    table.hours td:last-child { text-align: right; font-weight: 700; color: var(--ink); white-space: nowrap; font-variant-numeric: tabular-nums; }
    .note { font-size: var(--fs-small); color: var(--muted); margin-top: 10px; }
    .services { list-style: none; padding: 0; margin: 0; display: grid; gap: 4px 28px; }
    @media (min-width: 640px) { .services { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    .services li { display: grid; grid-template-columns: 24px 1fr; gap: 12px; align-items: start; padding: 12px 0; border-bottom: 1px solid var(--line); color: var(--ink); }
    .services li::before { content: ""; width: 12px; height: 12px; margin: 9px 0 0 5px; border-radius: 50%; background: var(--green); }
    .online { list-style: none; padding: 0; margin: 0; }
    .online li { display: flex; justify-content: space-between; gap: 8px 16px; padding: 14px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
    .online li:last-child { border-bottom: 0; }
    .online .v { font-weight: 700; color: var(--ink); }
    .online .s { font-size: var(--fs-small); color: var(--muted); }

    .core { display: grid; gap: var(--gap); }
    @media (min-width: 1024px) { .core { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    .core .card { border-top: 6px solid var(--blue); }
    .core .card:nth-child(2) { border-top-color: var(--spine); }
    .core .card:nth-child(3) { border-top-color: var(--navy); }
    .core .big { font-size: var(--fs-h3); font-weight: 700; color: var(--ink); line-height: var(--lh-h); margin: 4px 0 8px; }
    .core .alt { font-size: var(--fs-small); color: var(--muted); }
    .journey { display: grid; gap: var(--gap); }
    @media (min-width: 640px) { .journey { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (min-width: 1024px) { .journey { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
    .step { background: var(--white); border: 1px solid var(--line); border-radius: 16px; padding: var(--pad); }
    .step .num { width: 48px; height: 48px; border-radius: 50%; background: var(--navy); color: var(--white); font-weight: 800; font-size: 20px; display: grid; place-items: center; margin-bottom: 12px; }
    .step:nth-child(4) .num { background: var(--green); }
    .pillars { display: grid; gap: var(--gap); }
    @media (min-width: 1024px) { .pillars { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    .pillar { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 16px; overflow-wrap: anywhere; }
    .pillar .no { width: 52px; height: 52px; border-radius: 14px; background: var(--blue-tint); color: var(--blue-deep); font-size: 20px; font-weight: 800; display: grid; place-items: center; }
    @media (max-width: 399px) { .pillar { grid-template-columns: 44px minmax(0, 1fr); gap: 12px; } .pillar .no { width: 44px; height: 44px; } }
    .pillar ul { margin: 8px 0 0; padding-left: 20px; }
    .pillar li { margin: 6px 0; }
    .goal { display: flex; flex-direction: column; gap: 6px; }
    .goal .bar { width: 48px; height: 6px; border-radius: 3px; background: var(--spine); margin-bottom: 8px; }
    .quote { background: var(--navy); padding: var(--section) var(--gutter); text-align: center; }
    .quote p { margin: 0; font-size: var(--fs-h2); font-weight: 700; color: var(--white); line-height: var(--lh-h); }
    .quote span { display: block; margin-top: 10px; color: var(--on-navy); }

    .logo-card .stage { background: var(--white); border: 1px solid var(--line); border-radius: 12px; height: 160px; display: grid; place-items: center; padding: 18px; margin-bottom: 14px; }
    .logo-card .stage img { max-height: 120px; width: auto; }
    .logo-card .stage.dark { background: var(--navy); }
    .dl { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .dl a { font-size: 16px; font-weight: 700; text-decoration: none; padding: 0 14px; border-radius: 10px; border: 2px solid var(--blue-deep); color: var(--blue-deep); min-height: 44px; display: inline-flex; align-items: center; background: var(--white); }
    .dl a:hover { background: var(--blue-tint); }
    .print { display: grid; gap: var(--gap); }
    @media (min-width: 640px) { .print { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (min-width: 1024px) { .print { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    .print .card { padding: 14px; display: flex; flex-direction: column; }
    .print .thumb { background: var(--blue-tint); border-radius: 10px; overflow: hidden; display: grid; place-items: center; height: 300px; margin-bottom: 12px; }
    .print .thumb img { max-height: 100%; width: auto; object-fit: contain; }
    .swatches { display: grid; gap: var(--gap); grid-template-columns: repeat(2, minmax(0, 1fr)); }
    @media (min-width: 1024px) { .swatches { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
    .sw { overflow: hidden; padding: 0; }
    .sw .chipc { height: 96px; }
    .sw .meta { padding: 14px 16px; }
    .sw code { font-size: 16px; font-weight: 700; color: var(--ink); }
    .warn { background: var(--amber-bg); color: var(--amber-text); border-radius: 12px; padding: 16px 18px; font-weight: 700; }
    .checklist { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
    .checklist li { display: grid; grid-template-columns: 26px 1fr; gap: 12px; align-items: start; }
    .checklist li::before { content: ""; width: 20px; height: 20px; border: 2px solid var(--blue-deep); border-radius: 6px; margin-top: 4px; }
    .qr { display: grid; grid-template-columns: 120px 1fr; gap: 20px; align-items: center; }
    .qr img { border: 1px solid var(--line); border-radius: 10px; background: var(--white); padding: 8px; }

    footer.foot { background: linear-gradient(135deg, #14234A, #1E3263); color: var(--on-navy); font-size: 17px; border-top: 6px solid var(--spine); }
    footer.foot .wrap { display: flex; justify-content: space-between; gap: 12px 24px; flex-wrap: wrap; padding-block: 28px; }
    footer.foot b { color: var(--white); }
    [hidden] { display: none !important; }

    /* The menu always sits on its own row, so long Tamil labels never push the page wider. */
    header.top .wrap { flex-wrap: wrap; }
    nav.tabs { order: 3; width: 100%; margin-left: 0; flex-wrap: wrap; padding-bottom: 6px; }
    .lang { margin-left: auto; }
    @media (max-width: 639px) {
      nav.tabs { flex-wrap: nowrap; overflow-x: auto; scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch; scrollbar-width: thin; }
      nav.tabs a { scroll-snap-align: start; flex-shrink: 0; font-size: 16px; }
      nav.tabs a .n { display: none; }
    }
  </style>
</head>
<body>
  <a class="skip" href="#main" data-t="skip">Skip to content</a>

  <div class="notice" role="note">
    <div class="wrap">
      <span class="pill">Prototype</span>
      <span data-t="notice">Project prototype, styled with the website design system.</span>
    </div>
  </div>

  <header class="top">
    <div class="wrap">
      <a class="brand" href="#about" aria-label="Rani Ortho Care, about">
        <img id="logo" src="img/logo-horizontal-en.svg" alt="Rani Ortho Care" width="905" height="188">
      </a>
      <nav class="tabs" aria-label="Prototype sections">
        <a href="#about" data-page="about"><span class="n">1</span><span data-t="nav_about">About</span></a>
        <a href="#business" data-page="business"><span class="n">2</span><span data-t="nav_business">Business core</span></a>
        <a href="#assets" data-page="assets"><span class="n">3</span><span data-t="nav_assets">Assets</span></a>
        <a href="design-system.html"><span class="n">4</span><span data-t="nav_design">Design system</span></a>
        <a href="home-sample.html"><span class="n">5</span><span data-t="nav_home">Sample home</span></a>
        <a href="storybrand.html"><span class="n">6</span><span data-t="nav_story">StoryBrand</span></a>
      </nav>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="en" aria-pressed="true">EN</button>
        <button type="button" data-lang="ta" aria-pressed="false" class="tam">தமிழ்</button>
      </div>
    </div>
  </header>

  <div class="pagehead">
    <div class="wrap">
      <span class="eyebrow" id="ph-eyebrow"></span>
      <h1 id="ph-title"></h1>
      <p class="lead" id="ph-lead"></p>
      <div class="chips" id="ph-chips"></div>
    </div>
  </div>

  <main id="main" tabindex="-1">
    <div id="page-about" data-view="about"></div>
    <div id="page-business" data-view="business" hidden></div>
    <div id="page-assets" data-view="assets" hidden></div>
  </main>

  <footer class="foot">
    <div class="wrap">
      <span><b id="f-name"></b> · <span id="f-tag"></span></span>
      <span><span data-t="updated">Last updated</span> <span id="f-date"></span></span>
    </div>
  </footer>

  <script src="content.js"></script>
  <script>
  (function () {
    const C = window.CONTENT;
    let lang = "en";
    try { lang = localStorage.getItem("roc-proto-lang") || "en"; } catch (e) {}

    // Interface labels (content lives in content.js).
    const UI = {
      skip: { en: "Skip to content", ta: "நேராக உள்ளே செல்ல" },
      notice: { en: "Project prototype, styled with the website design system.", ta: "ப்ராஜெக்ட் மாதிரி. வெப்சைட் டிசைன் சிஸ்டத்தின்படி அமைக்கப்பட்டது." },
      nav_about: { en: "About", ta: "எங்களைப் பற்றி" },
      nav_business: { en: "Business core", ta: "கிளினிக்கின் அடிப்படை" },
      nav_assets: { en: "Assets", ta: "லோகோ, ஃபைல்கள்" },
      nav_design: { en: "Design system", ta: "டிசைன்" },
      nav_home: { en: "Sample home", ta: "மாதிரி முகப்பு" },
      nav_story: { en: "StoryBrand", ta: "StoryBrand" },
      updated: { en: "Last updated", ta: "கடைசியாக மாற்றியது" },

      document.getElementById("logo").src = lang === "ta" ? "img/logo-horizontal-ta.svg" : "img/logo-horizontal-en.svg";
      document.querySelectorAll("nav.tabs a").forEach((a) => { if (a.dataset.page === current) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
      document.querySelectorAll("[data-view]").forEach((v) => { v.hidden = v.dataset.view !== current; if (!v.hidden) v.innerHTML = views[current](); });
      head(current);
      document.getElementById("f-name").textContent = t(C.clinic.name);
      document.getElementById("f-tag").textContent = t(C.clinic.tagline);
      document.getElementById("f-date").textContent = C.updated;
      document.title = t(C.clinic.name) + " · " + u("nav_" + current) + " · Prototype";
    }

    document.querySelectorAll(".lang button").forEach((b) => b.addEventListener("click", () => {
      lang = b.dataset.lang;
      try { localStorage.setItem("roc-proto-lang", lang); } catch (e) {}
      render();
    }));
    window.addEventListener("hashchange", () => { render(); window.scrollTo(0, 0); });
    render();
  })();
  </script>
</body>
</html>
