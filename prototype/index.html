<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rani Ortho Care Prototype</title>
  <meta name="claude:viewport-fit-sides" content="cover">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="img/mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* TEMPORARY prototype palette, taken from the brand assets. This is NOT the website design system;
       the mood board and design system come later. */
    :root {
      --blue: #3C59A8;
      --blue-dark: #2E4689;
      --green: #3DB54A;
      --navy: #1B2A55;
      --sky: #7FD0F0;
      --sky-soft: #EAF6FC;
      --bg: #F6F8FC;
      --card: #FFFFFF;
      --ink: #14213D;
      --body: #3B4660;
      --muted: #5B6680;
      --line: #DFE5F0;
      --accent-text: #3C59A8;   /* blue used as text; lighter in dark mode */
      --white: #FFFFFF;         /* text on blue/navy fills, and the logo stage (logos need white) */
      --on-navy: #DCE4F5;
      --on-navy-soft: #BFE6F7;
      --header-bg: rgba(255, 255, 255, .94);
      --surface-2: #EEF2F8;
      --callout-bg: #F2FAF3;
      --warn-bg: #FFF8E6;
      --warn-line: #F3DFA6;
      --warn-fg: #5C4A12;
      --quote-fade: #FFFFFF;
      --radius: 16px;
      --shadow: 0 1px 2px rgba(20, 33, 61, .06), 0 8px 24px rgba(20, 33, 61, .06);
      --font: "Inter", "Noto Sans Tamil", system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --sky-soft: #1C2A4A; --bg: #0E1424; --card: #151D33; --ink: #E8EDF8; --body: #C3CCE0; --muted: #98A4C0; --line: #27334F;
        --accent-text: #A3B9F2; --header-bg: rgba(14, 20, 36, .92); --surface-2: #1B2440; --callout-bg: #14301D;
        --warn-bg: #33290F; --warn-line: #5E4B17; --warn-fg: #F3E2B0; --quote-fade: #151D33;
        --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25); color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --sky-soft: #1C2A4A; --bg: #0E1424; --card: #151D33; --ink: #E8EDF8; --body: #C3CCE0; --muted: #98A4C0; --line: #27334F;
      --accent-text: #A3B9F2; --header-bg: rgba(14, 20, 36, .92); --surface-2: #1B2440; --callout-bg: #14301D;
      --warn-bg: #33290F; --warn-line: #5E4B17; --warn-fg: #F3E2B0; --quote-fade: #151D33;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25); color-scheme: dark;
    }
    :root[lang="ta"] { --font: "Noto Sans Tamil", "Inter", system-ui, sans-serif; }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; } }
    body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--header-bg); }
    body { margin: 0; font-family: var(--font); color: var(--body); background: var(--bg); line-height: 1.6; -webkit-font-smoothing: antialiased; }
    img { max-width: 100%; display: block; }
    a { color: var(--accent-text); }
    :focus-visible { outline: 3px solid var(--green); outline-offset: 2px; border-radius: 6px; }
    .wrap { max-width: 1120px; margin: 0 auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
    .skip { position: absolute; left: -999px; top: 8px; background: var(--navy); color: var(--white); padding: 8px 14px; border-radius: 8px; z-index: 100; }
    .skip:focus { left: 8px; }

    /* Notice */
    .notice { background: var(--navy); color: var(--on-navy); font-size: 13px; }
    .notice .wrap { display: flex; gap: 10px; align-items: center; justify-content: center; padding-top: 8px; padding-bottom: 8px; text-align: center; flex-wrap: wrap; }
    .notice b { color: var(--white); }
    .pill { display: inline-block; background: var(--green); color: var(--navy); font-weight: 700; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; }

    /* Header */
    header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: var(--header-bg); backdrop-filter: saturate(160%) blur(8px); border-bottom: 1px solid var(--line); }
    header.top .wrap { display: flex; align-items: center; gap: 20px; min-height: 72px; }
    .brand { display: flex; align-items: center; flex-shrink: 0; }
    .brand img { height: 40px; width: auto; }
    .brand { background: var(--white); border-radius: 10px; padding: 4px 8px; }
    nav.tabs { display: flex; gap: 4px; margin-left: auto; }
    nav.tabs a { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border-radius: 10px; text-decoration: none; color: var(--body); font-weight: 600; font-size: 15px; white-space: nowrap; }
    nav.tabs a .n { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--sky-soft); color: var(--accent-text); font-size: 12px; font-weight: 700; }
    nav.tabs a:hover { background: var(--sky-soft); color: var(--accent-text); }
    nav.tabs a[aria-current="page"] { background: var(--blue); color: var(--white); }
    nav.tabs a[aria-current="page"] .n { background: var(--white); color: var(--blue); }
    .lang { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; flex-shrink: 0; }
    .lang button { min-height: 40px; min-width: 52px; padding: 0 12px; border: 0; background: var(--card); font: 600 14px var(--font); color: var(--muted); cursor: pointer; }
    .lang button[aria-pressed="true"] { background: var(--navy); color: var(--white); }

    /* Page head */
    .pagehead { background: linear-gradient(135deg, var(--navy) 0%, var(--blue) 62%, #4A86C8 100%); color: var(--white); position: relative; overflow: hidden; }
    .pagehead::after { content: ""; position: absolute; right: -120px; top: -160px; width: 520px; height: 520px; border-radius: 50%; background: radial-gradient(circle, rgba(127,208,240,.35), rgba(127,208,240,0) 70%); pointer-events: none; }
    .pagehead::before { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: linear-gradient(90deg, var(--blue) 0 60%, var(--green) 60% 100%); }
    .pagehead .wrap { position: relative; z-index: 1; padding-top: 48px; padding-bottom: 52px; }
    .eyebrow { display: inline-flex; gap: 8px; align-items: center; font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--on-navy-soft); }
    .eyebrow::before { content: ""; width: 18px; height: 3px; background: var(--green); border-radius: 2px; }
    .pagehead h1 { font-size: clamp(30px, 4.4vw, 46px); line-height: 1.15; margin: 12px 0 10px; color: var(--white); font-weight: 800; letter-spacing: -.01em; }
    :root[lang="ta"] .pagehead h1 { letter-spacing: 0; line-height: 1.3; }
    .pagehead p.lead { font-size: 18px; max-width: 760px; margin: 0; color: var(--on-navy); }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 22px; }
    .chip { background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.22); color: var(--white); padding: 6px 12px; border-radius: 999px; font-size: 14px; }

    main.wrap { padding-top: 44px; padding-bottom: 72px; }
    section.block { margin-bottom: 44px; }
    h2 { font-size: 24px; line-height: 1.3; color: var(--ink); margin: 0 0 6px; font-weight: 750; }
    .sub { color: var(--muted); margin: 0 0 20px; }
    h3 { font-size: 17px; color: var(--ink); margin: 0 0 6px; line-height: 1.35; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 24px; }
    .grid { display: grid; gap: 18px; }
    .g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .label { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px; }
    .tam { font-family: "Noto Sans Tamil", var(--font); }

    /* About */
    .doctor { display: grid; grid-template-columns: 220px 1fr; gap: 28px; align-items: center; }
    .portrait { aspect-ratio: 4/5; max-width: 100%; border-radius: 14px; background: linear-gradient(160deg, var(--sky-soft), var(--surface-2)); border: 2px dashed var(--line); display: grid; place-items: center; text-align: center; color: var(--muted); font-size: 13px; padding: 16px; }
    .portrait img { width: 64px; margin: 0 auto 10px; opacity: .9; }
    .doctor h3 { font-size: 26px; margin-bottom: 2px; }
    .quals { color: var(--accent-text); font-weight: 700; margin: 0 0 12px; }
    .tags { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 14px; padding: 0; list-style: none; }
    .tags li { background: var(--sky-soft); color: var(--accent-text); padding: 5px 12px; border-radius: 999px; font-size: 14px; font-weight: 600; }
    .callout { border-left: 4px solid var(--green); background: var(--callout-bg); padding: 12px 16px; border-radius: 0 10px 10px 0; color: var(--ink); margin-top: 12px; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
    .btn { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 10px; font-weight: 650; text-decoration: none; font-size: 15px; }
    .btn-primary { background: var(--blue); color: var(--white); }
    .btn-primary:hover { background: var(--blue-dark); }
    .btn-ghost { background: var(--card); color: var(--accent-text); border: 1.5px solid var(--accent-text); }
    .btn svg { width: 18px; height: 18px; }
    .kv { display: grid; gap: 14px; }
    .kv .row { display: grid; grid-template-columns: 36px 1fr; gap: 12px; align-items: start; }
    .ico { width: 36px; height: 36px; border-radius: 10px; background: var(--sky-soft); color: var(--accent-text); display: grid; place-items: center; }
    .ico svg { width: 18px; height: 18px; }
    .kv .v { color: var(--ink); font-weight: 600; }
    .kv .v a { color: var(--ink); text-decoration: none; }
    .kv .v a:hover { color: var(--accent-text); text-decoration: underline; }
    table.hours { width: 100%; border-collapse: collapse; }
    table.hours td { padding: 10px 0; border-bottom: 1px solid var(--line); }
    table.hours td:last-child { text-align: right; font-weight: 700; color: var(--ink); white-space: nowrap; }
    .note { font-size: 13px; color: var(--muted); margin-top: 10px; }
    .services { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 24px; }
    .services li { display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: start; padding: 10px 0; border-bottom: 1px dashed var(--line); color: var(--ink); }
    .services li::before { content: ""; width: 10px; height: 10px; margin: 8px 0 0 4px; border-radius: 3px; background: var(--green); transform: rotate(45deg); }
    .online { list-style: none; padding: 0; margin: 0; }
    .online li { display: flex; justify-content: space-between; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
    .online .v { font-weight: 700; color: var(--ink); }
    .online .s { font-size: 13px; color: var(--muted); }

    /* Business */
    .core { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
    .core .card { border-top: 4px solid var(--blue); }
    .core .card:nth-child(2) { border-top-color: var(--green); }
    .core .card:nth-child(3) { border-top-color: var(--navy); }
    .core .big { font-size: 20px; font-weight: 750; color: var(--ink); line-height: 1.35; margin: 4px 0 6px; }
    .core .alt { font-size: 15px; color: var(--muted); }
    .journey { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; counter-reset: s; }
    .step { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px 20px; box-shadow: var(--shadow); }
    .step .num { width: 40px; height: 40px; border-radius: 12px; background: var(--blue); color: var(--white); font-weight: 800; display: grid; place-items: center; margin-bottom: 12px; }
    .step:nth-child(4) .num { background: var(--green); color: var(--navy); }
    .step:not(:last-child)::after { content: ""; position: absolute; right: -12px; top: 38px; width: 10px; height: 10px; border-top: 3px solid var(--sky); border-right: 3px solid var(--sky); transform: rotate(45deg); }
    .pillars { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
    .pillar { display: grid; grid-template-columns: 56px 1fr; gap: 16px; }
    .pillar .no { font-size: 28px; font-weight: 800; color: var(--sky); line-height: 1; }
    .pillar ul { margin: 8px 0 0; padding-left: 18px; }
    .pillar li { margin: 4px 0; }
    .goal { display: flex; flex-direction: column; gap: 6px; }
    .goal .bar { width: 40px; height: 4px; border-radius: 2px; background: var(--green); margin-bottom: 6px; }
    .quote { background: linear-gradient(135deg, var(--sky-soft), var(--quote-fade)); border: 1px solid var(--line); border-radius: var(--radius); padding: 28px; text-align: center; }
    .quote p { margin: 0; font-size: clamp(20px, 2.6vw, 28px); font-weight: 750; color: var(--ink); }
    .quote span { display: block; margin-top: 8px; color: var(--muted); }

    /* Assets */
    .logo-card .stage { background: var(--white); border: 1px solid var(--line); border-radius: 12px; height: 160px; display: grid; place-items: center; padding: 18px; margin-bottom: 14px; }
    .logo-card .stage img { max-height: 120px; width: auto; }
    .logo-card .stage.dark { background: var(--navy); }
    .dl { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .dl a { font-size: 13px; font-weight: 700; text-decoration: none; padding: 6px 10px; border-radius: 8px; background: var(--sky-soft); color: var(--accent-text); min-height: 32px; display: inline-flex; align-items: center; }
    .dl a:hover { background: var(--blue); color: var(--white); }
    .print { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
    .print .card { padding: 14px; display: flex; flex-direction: column; }
    .print .thumb { background: var(--surface-2); border-radius: 10px; overflow: hidden; display: grid; place-items: center; height: 300px; margin-bottom: 12px; }
    .print .thumb img { max-height: 100%; width: auto; object-fit: contain; }
    .swatches { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; }
    .sw { overflow: hidden; padding: 0; }
    .sw .chipc { height: 96px; }
    .sw .meta { padding: 14px 16px; }
    .sw code { font-size: 14px; font-weight: 700; color: var(--ink); }
    .warn { background: var(--warn-bg); border: 1px solid var(--warn-line); color: var(--warn-fg); border-radius: 12px; padding: 14px 16px; font-size: 14px; }
    .checklist { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
    .checklist li { display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: start; }
    .checklist li::before { content: ""; width: 18px; height: 18px; border: 2px solid var(--accent-text); border-radius: 5px; margin-top: 3px; }
    .qr { display: grid; grid-template-columns: 140px 1fr; gap: 20px; align-items: center; }
    .qr img { border: 1px solid var(--line); border-radius: 10px; background: var(--white); padding: 8px; }

    footer.foot { background: var(--navy); color: var(--on-navy); font-size: 14px; }
    footer.foot .wrap { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding-top: 22px; padding-bottom: 22px; }

    [hidden] { display: none !important; }

    @media (max-width: 960px) {
      .g4, .swatches, .journey { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .step:nth-child(2)::after { display: none; }
      .g3, .core, .print { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      header.top .wrap { flex-wrap: wrap; padding-top: 10px; padding-bottom: 10px; }
      nav.tabs { order: 3; width: 100%; margin-left: 0; overflow-x: auto; }
      .lang { margin-left: auto; }
    }
    @media (max-width: 640px) {
      .wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
      .brand img { height: 32px; }
      .g2, .g3, .g4, .core, .pillars, .print, .services, .swatches, .journey { grid-template-columns: 1fr; }
      .step::after { display: none; }
      .doctor { grid-template-columns: 1fr; }
      .portrait { max-width: 200px; }
      nav.tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); overflow: visible; }
      nav.tabs a { justify-content: center; text-align: center; white-space: normal; padding: 6px 6px; font-size: 13px; line-height: 1.25; }
      nav.tabs a .n { display: none; }
      .portrait { max-width: 160px; }
      .notice { font-size: 12px; }
      .card { padding: 18px; }
      .qr { grid-template-columns: 100px 1fr; }
    }
  </style>
</head>
<body>
  <a class="skip" href="#main" data-t="skip">Skip to content</a>

  <div class="notice" role="note">
    <div class="wrap">
      <span class="pill">Prototype</span>
      <span data-t="notice">Project prototype. Colours are temporary and taken from the brand assets. The website design comes after the mood board.</span>
    </div>
  </div>

  <header class="top">
    <div class="wrap">
      <a class="brand" href="#about" aria-label="Rani Ortho Care, about">
        <img id="logo" src="img/logo-horizontal-en.svg" alt="Rani Ortho Care" width="905" height="188">
      </a>
      <nav class="tabs" aria-label="Prototype sections">
        <a href="#about" data-page="about"><span class="n">1</span><span data-t="nav_about">About</span></a>
        <a href="#business" data-page="business"><span class="n">2</span><span data-t="nav_business">Business core</span></a>
        <a href="#assets" data-page="assets"><span class="n">3</span><span data-t="nav_assets">Assets</span></a>
      </nav>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="en" aria-pressed="true">EN</button>
        <button type="button" data-lang="ta" aria-pressed="false" class="tam">தமிழ்</button>
      </div>
    </div>
  </header>

  <div class="pagehead">
    <div class="wrap">
      <span class="eyebrow" id="ph-eyebrow"></span>
      <h1 id="ph-title"></h1>
      <p class="lead" id="ph-lead"></p>
      <div class="chips" id="ph-chips"></div>
    </div>
  </div>

  <main id="main" class="wrap" tabindex="-1">
    <div id="page-about" data-view="about"></div>
    <div id="page-business" data-view="business" hidden></div>
    <div id="page-assets" data-view="assets" hidden></div>
  </main>

  <footer class="foot">
    <div class="wrap">
      <span><b id="f-name"></b> · <span id="f-tag"></span></span>
      <span><span data-t="updated">Last updated</span> <span id="f-date"></span></span>
    </div>
  </footer>

  <script src="content.js"></script>
  <script>
  (function () {
    const C = window.CONTENT;
    let lang = "en";
    try { lang = localStorage.getItem("roc-proto-lang") || "en"; } catch (e) {}

    // Interface labels (content lives in content.js).
    const UI = {
      skip: { en: "Skip to content", ta: "உள்ளடக்கத்திற்குச் செல்ல" },
      notice: { en: "Project prototype. Colours are temporary and taken from the brand assets. The website design comes after the mood board.", ta: "திட்ட மாதிரி. வண்ணங்கள் தற்காலிகமானவை, பிராண்ட் கோப்புகளிலிருந்து எடுக்கப்பட்டவை. இணையதள வடிவமைப்பு மூட் போர்டுக்குப் பிறகு." },
      nav_about: { en: "About", ta: "எங்களைப் பற்றி" },
      nav_business: { en: "Business core", ta: "வணிக அடிப்படை" },
      nav_assets: { en: "Assets", ta: "கோப்புகள்" },
      updated: { en: "Last updated", ta: "கடைசியாகப் புதுப்பித்தது" },
      about_eyebrow: { en: "1 · About", ta: "1 · எங்களைப் பற்றி" },
      business_eyebrow: { en: "2 · Business core", ta: "2 · வணிக அடிப்படை" },
      business_title: { en: "Relieve the pain. Find the cause. Move again.", ta: "வலி நிவாரணம். மூல காரணம். மீண்டும் இயக்கம்." },
      business_lead: { en: "How Rani Ortho Care works, what it offers and what the website must achieve.", ta: "ராணி ஆர்த்தோ கேர் எப்படிச் செயல்படுகிறது, என்ன வழங்குகிறது, இணையதளம் எதைச் சாதிக்க வேண்டும்." },
      assets_eyebrow: { en: "3 · Assets", ta: "3 · கோப்புகள்" },
      assets_title: { en: "What we have to build with", ta: "எங்களிடம் உள்ள கோப்புகள்" },
      assets_lead: { en: "Logos, print materials, brand colours and what is still needed. Original files are in the brand-assets folder.", ta: "லோகோக்கள், அச்சுப் பொருட்கள், பிராண்ட் வண்ணங்கள் மற்றும் இன்னும் தேவையானவை." },
      doctor_h: { en: "The doctor", ta: "மருத்துவர்" },
      doctor_sub: { en: "The person behind Rani Ortho Care.", ta: "ராணி ஆர்த்தோ கேர் மையத்தின் மருத்துவர்." },
      photo_soon: { en: "Doctor's photo to come", ta: "மருத்துவரின் புகைப்படம் விரைவில்" },
      call: { en: "Call", ta: "அழைக்க" },
      whatsapp: { en: "WhatsApp", ta: "வாட்ஸ்அப்" },
      directions: { en: "Directions", ta: "வழி" },
      visit_h: { en: "Visit and contact", ta: "தொடர்பு மற்றும் முகவரி" },
      visit_sub: { en: "One set of details, used everywhere: website, Google, print.", ta: "இணையதளம், Google, அச்சு அனைத்திலும் ஒரே விவரங்கள்." },
      phone_l: { en: "Phone and WhatsApp", ta: "தொலைபேசி மற்றும் வாட்ஸ்அப்" },
      landline_l: { en: "Landline", ta: "லேண்ட்லைன்" },
      address_l: { en: "Address", ta: "முகவரி" },
      hours_h: { en: "Opening hours", ta: "நேரம்" },
      services_h: { en: "Services", ta: "சேவைகள்" },
      services_sub: { en: "As printed on the clinic's services sheet.", ta: "மையத்தின் சேவைப் பட்டியலின்படி." },
      online_h: { en: "Online presence", ta: "இணைய இருப்பு" },
      core_h: { en: "The core", ta: "அடிப்படை" },
      core_mission: { en: "Mission", ta: "நோக்கம்" },
      core_phil: { en: "Philosophy", ta: "தத்துவம்" },
      core_promise: { en: "Promise of care", ta: "சிகிச்சை உறுதி" },
      promise: { en: "Pain relief first, root-cause treatment, restored movement. Safely.", ta: "முதலில் வலி நிவாரணம், மூல காரண சிகிச்சை, இயக்கம் மீட்பு. பாதுகாப்பாக." },
      journey_h: { en: "The care journey", ta: "சிகிச்சைப் பயணம்" },
      journey_sub: { en: "The order every patient's care follows.", ta: "ஒவ்வொரு நோயாளியின் சிகிச்சையும் பின்பற்றும் வரிசை." },
      pillars_h: { en: "Eight pillars of the business", ta: "வணிகத்தின் எட்டு தூண்கள்" },
      pillars_sub: { en: "From the clinic's business model document.", ta: "வணிக மாதிரி ஆவணத்திலிருந்து." },
      goals_h: { en: "Goals for the website", ta: "இணையதளத்தின் இலக்குகள்" },
      goals_sub: { en: "What success looks like.", ta: "வெற்றி என்பது இதுதான்." },
      logos_h: { en: "Logo", ta: "லோகோ" },
      logos_sub: { en: "The R with the green spine, in English and Tamil, stacked and horizontal.", ta: "பச்சை முதுகெலும்புடன் R, ஆங்கிலம் மற்றும் தமிழில்." },
      mark_l: { en: "Icon (R mark)", ta: "சின்னம் (R)" },
      mark_use: { en: "Favicon, app icon, social avatar", ta: "ஃபேவிகான், ஆப் ஐகான், சமூக ஊடகப் படம்" },
      on_dark: { en: "On dark", ta: "அடர் பின்னணியில்" },
      print_h: { en: "Print materials", ta: "அச்சுப் பொருட்கள்" },
      print_sub: { en: "The clinic's existing visiting cards, prescription pad and covers.", ta: "தற்போதுள்ள விசிட்டிங் கார்டுகள், மருந்துச் சீட்டு, அட்டைகள்." },
      open_pdf: { en: "Open PDF", ta: "PDF திற" },
      stock_warn: { en: "Some cover photos are stock or AI images, and one shows an Adobe Stock watermark. The website needs real or licensed photos.", ta: "சில அட்டைப் படங்கள் ஸ்டாக் அல்லது AI படங்கள்; ஒன்றில் Adobe Stock வாட்டர்மார்க் உள்ளது. இணையதளத்திற்கு உண்மையான அல்லது உரிமம் பெற்ற படங்கள் தேவை." },
      colours_h: { en: "Brand colours (from the assets)", ta: "பிராண்ட் வண்ணங்கள்" },
      colours_sub: { en: "Taken from the logo and print. Used here for the prototype only; the website palette comes from the mood board.", ta: "லோகோ மற்றும் அச்சிலிருந்து எடுக்கப்பட்டவை. இந்த மாதிரிக்கு மட்டும்." },
      qr_h: { en: "Map QR code", ta: "வரைபட QR குறியீடு" },
      qr_text: { en: "Opens the clinic's location on the map. Printed on the visiting cards.", ta: "மையத்தின் இருப்பிடத்தை வரைபடத்தில் திறக்கும். விசிட்டிங் கார்டில் உள்ளது." },
      type_h: { en: "Type in the assets", ta: "எழுத்துரு" },
      type_text: { en: "English wordmark: heavy grotesque (Helvetica Bold style). Tamil wordmark: heavy display Tamil. Print body: geometric sans. The website will need a font that renders Tamil well.", ta: "ஆங்கிலப் பெயர்: தடித்த எழுத்துரு. தமிழ்ப் பெயர்: தடித்த தமிழ் எழுத்துரு. இணையதளத்திற்கு தமிழ் நன்றாகத் தெரியும் எழுத்துரு தேவை." },
      needed_h: { en: "Still needed", ta: "இன்னும் தேவை" },
    };

    const t = (v) => (v == null ? "" : typeof v === "string" ? v : (v[lang] || v.en || ""));
    const u = (k) => t(UI[k]);
    const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const T = (v) => esc(t(v));
    const enc = (p) => p.split("/").map(encodeURIComponent).join("/");

    const icon = {
      phone: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>',
      chat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 21l2-5.4A8.4 8.4 0 1 1 21 11.5z"/></svg>',
      pin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>',
      landline: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="9" width="18" height="12" rx="2"/><path d="M7 9V6a5 5 0 0 1 10 0v3"/><circle cx="12" cy="15" r="2"/></svg>',
    };

    const ph = C.contact.phone;
    const mapsUrl = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent("Rani Ortho Care, Koviloor Road, Karaikudi");

    function about() {
      const d = C.doctor;
      return `
      <section class="block" aria-labelledby="h-doc">
        <h2 id="h-doc">${u("doctor_h")}</h2>
        <p class="sub">${u("doctor_sub")}</p>
        <div class="card doctor">
          <div class="portrait"><div><img src="img/mark.svg" alt="" width="222" height="245">${u("photo_soon")}</div></div>
          <div>
            <h3>${T(d.name)}</h3>
            <p class="quals">${esc(d.qualifications)}</p>
            <ul class="tags">${d.roles.map((r) => `<li>${T(r)}</li>`).join("")}</ul>
            <p>${T(d.note)}</p>
            <p class="callout">${T(d.community)}</p>
            <div class="actions">
              <a class="btn btn-primary" href="tel:${ph.tel}">${icon.phone}${u("call")} ${esc(ph.display)}</a>
              <a class="btn btn-ghost" href="https://wa.me/${ph.whatsapp}" target="_blank" rel="noopener">${icon.chat}${u("whatsapp")}</a>
            </div>
          </div>
        </div>
      </section>

      <section class="block" aria-labelledby="h-visit">
        <h2 id="h-visit">${u("visit_h")}</h2>
        <p class="sub">${u("visit_sub")}</p>
        <div class="grid g2">
          <div class="card kv">
            <div class="row"><span class="ico">${icon.phone}</span><div><p class="label">${u("phone_l")}</p><div class="v"><a href="tel:${ph.tel}">${esc(ph.display)}</a></div></div></div>
            <div class="row"><span class="ico">${icon.landline}</span><div><p class="label">${u("landline_l")}</p><div class="v"><a href="tel:${C.contact.landline.tel}">${esc(C.contact.landline.display)}</a></div></div></div>
            <div class="row"><span class="ico">${icon.pin}</span><div><p class="label">${u("address_l")}</p><div class="v">${T(C.contact.address)}</div>
              <div class="actions"><a class="btn btn-ghost" href="${mapsUrl}" target="_blank" rel="noopener">${icon.pin}${u("directions")}</a></div></div></div>
          </div>
          <div class="card">
            <h3>${u("hours_h")}</h3>
            <table class="hours"><tbody>
              ${C.contact.hours.map((h) => `<tr><td>${T(h.days)}</td><td>${esc(h.time)}</td></tr>`).join("")}
            </tbody></table>
            <p class="note">${T(C.contact.hoursSource)}</p>
          </div>
        </div>
      </section>

      <section class="block" aria-labelledby="h-svc">
        <h2 id="h-svc">${u("services_h")}</h2>
        <p class="sub">${u("services_sub")}</p>
        <div class="card"><ul class="services">${C.services.map((s) => `<li>${T(s)}</li>`).join("")}</ul></div>
      </section>

      <section class="block" aria-labelledby="h-online">
        <h2 id="h-online">${u("online_h")}</h2>
        <div class="card"><ul class="online">
          ${C.online.map((o) => `<li><div><p class="label">${T(o.label)}</p><div class="v">${o.href ? `<a href="${o.href}" target="_blank" rel="noopener">${esc(o.value)}</a>` : esc(o.value)}</div></div><div class="s">${T(o.status)}</div></li>`).join("")}
        </ul></div>
      </section>`;
    }

    function business() {
      return `
      <section class="block" aria-labelledby="h-core">
        <h2 id="h-core">${u("core_h")}</h2>
        <p class="sub">&nbsp;</p>
        <div class="core">
          <div class="card"><p class="label">${u("core_mission")}</p><p class="big">${T(C.clinic.tagline)}</p><p class="alt">${lang === "en" ? esc(C.clinic.tagline.ta) : esc(C.clinic.tagline.en)}</p></div>
          <div class="card"><p class="label">${u("core_phil")}</p><p class="big">${T(C.clinic.philosophy)}</p><p class="alt">${lang === "en" ? esc(C.clinic.philosophy.ta) : esc(C.clinic.philosophy.en)}</p></div>
          <div class="card"><p class="label">${u("core_promise")}</p><p class="big">${u("promise")}</p></div>
        </div>
      </section>

      <section class="block" aria-labelledby="h-journey">
        <h2 id="h-journey">${u("journey_h")}</h2>
        <p class="sub">${u("journey_sub")}</p>
        <ol class="journey" style="list-style:none;padding:0;margin:0">
          ${C.journey.map((s) => `<li class="step"><div class="num">${s.step}</div><h3>${T(s.title)}</h3><p style="margin:0">${T(s.text)}</p></li>`).join("")}
        </ol>
      </section>

      <section class="block" aria-labelledby="h-pillars">
        <h2 id="h-pillars">${u("pillars_h")}</h2>
        <p class="sub">${u("pillars_sub")}</p>
        <div class="pillars">
          ${C.pillars.map((p) => `<div class="card pillar"><div class="no">${p.no}</div><div><h3>${T(p.title)}</h3><ul>${p.points.map((x) => `<li>${T(x)}</li>`).join("")}</ul></div></div>`).join("")}
        </div>
      </section>

      <section class="block" aria-labelledby="h-goals">
        <h2 id="h-goals">${u("goals_h")}</h2>
        <p class="sub">${u("goals_sub")}</p>
        <div class="grid g4">
          ${C.goals.map((g) => `<div class="card goal"><span class="bar"></span><h3>${T(g.title)}</h3><p style="margin:0">${T(g.text)}</p></div>`).join("")}
        </div>
      </section>

      <div class="quote"><p>${T(C.clinic.philosophy)}</p><span>${T(C.clinic.name)} · ${T(C.clinic.tagline)}</span></div>`;
    }

    function assets() {
      const logoPath = (f, ext) => "../brand-assets/logo/" + ext.toUpperCase() + "/" + enc(f + "." + (ext === "jpeg" ? "jpg" : ext));
      const preview = { "Rani Ortho Care V1-1": "img/logo-stacked-en.svg", "Rani Ortho Care V2-1": "img/logo-horizontal-en.svg", "Rani Ortho Care V1": "img/logo-stacked-ta.svg", "Rani Ortho Care V2": "img/logo-horizontal-ta.svg" };
      return `
      <section class="block" aria-labelledby="h-logos">
        <h2 id="h-logos">${u("logos_h")}</h2>
        <p class="sub">${u("logos_sub")}</p>
        <div class="grid g2">
          ${C.logos.map((l) => `<div class="card logo-card"><div class="stage"><img src="${preview[l.file]}" alt="${esc(t(l.name))}" loading="lazy"></div>
            <h3>${T(l.name)}</h3><p class="note" style="margin:0">${T(l.use)}</p>
            <div class="dl"><a href="${logoPath(l.file, "svg")}" target="_blank" rel="noopener">SVG</a><a href="${logoPath(l.file, "png")}" target="_blank" rel="noopener">PNG</a><a href="${logoPath(l.file, "jpeg")}" target="_blank" rel="noopener">JPEG</a></div></div>`).join("")}
          <div class="card logo-card"><div class="stage"><img src="img/mark.svg" alt="${u("mark_l")}" style="max-height:110px"></div><h3>${u("mark_l")}</h3><p class="note" style="margin:0">${u("mark_use")}</p></div>
          <div class="card logo-card"><div class="stage dark"><img src="img/mark.svg" alt="" style="max-height:110px;background:var(--white);border-radius:18px;padding:10px"></div><h3>${u("mark_l")} · ${u("on_dark")}</h3><p class="note" style="margin:0">${u("mark_use")}</p></div>
        </div>
      </section>

      <section class="block" aria-labelledby="h-print">
        <h2 id="h-print">${u("print_h")}</h2>
        <p class="sub">${u("print_sub")}</p>
        <div class="print">
          ${C.print.map((p) => `<div class="card"><div class="thumb"><img src="${p.preview}" alt="${esc(t(p.name))}" loading="lazy"></div><h3>${T(p.name)}</h3><div class="dl" style="margin-top:auto"><a href="../brand-assets/${enc(p.file)}" target="_blank" rel="noopener">${u("open_pdf")}</a></div></div>`).join("")}
        </div>
        <p class="warn" style="margin-top:18px">${u("stock_warn")}</p>
      </section>

      <section class="block" aria-labelledby="h-colours">
        <h2 id="h-colours">${u("colours_h")}</h2>
        <p class="sub">${u("colours_sub")}</p>
        <div class="swatches">
          ${C.colours.map((c) => `<div class="card sw"><div class="chipc" style="background:${c.hex}"></div><div class="meta"><h3>${T(c.name)}</h3><code>${c.hex}</code><p class="note" style="margin:4px 0 0">${T(c.from)}</p></div></div>`).join("")}
        </div>
      </section>

      <section class="block grid g2" aria-label="QR and type">
        <div class="card qr"><img src="../brand-assets/map-link-qr.png" alt="QR code to the clinic's map location" width="140" height="140" loading="lazy"><div><h3>${u("qr_h")}</h3><p style="margin:0">${u("qr_text")}</p></div></div>
        <div class="card"><h3>${u("type_h")}</h3><p style="margin:0">${u("type_text")}</p></div>
      </section>

      <section class="block" aria-labelledby="h-needed">
        <h2 id="h-needed">${u("needed_h")}</h2>
        <div class="card"><ul class="checklist">${C.needed.map((n) => `<li>${T(n)}</li>`).join("")}</ul></div>
      </section>`;
    }

    const views = { about, business, assets };

    function head(page) {
      const e = document.getElementById("ph-eyebrow"), h = document.getElementById("ph-title"), l = document.getElementById("ph-lead"), c = document.getElementById("ph-chips");
      if (page === "about") {
        e.textContent = u("about_eyebrow");
        h.textContent = t(C.clinic.name);
        l.textContent = t(C.clinic.intro);
        c.innerHTML = [t(C.clinic.tagline), t(C.clinic.type), "Dr. N. Manikandan · M.B.B.S., M.S. (Ortho)"].map((x) => `<span class="chip">${esc(x)}</span>`).join("");
      } else {
        e.textContent = u(page + "_eyebrow");
        h.textContent = u(page + "_title");
        l.textContent = u(page + "_lead");
        c.innerHTML = page === "business" ? `<span class="chip">${esc(t(C.clinic.philosophy))}</span>` : "";
      }
    }

    function render() {
      const page = (location.hash || "#about").slice(1);
      const current = views[page] ? page : "about";
      document.documentElement.lang = lang;
      document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = u(el.dataset.t); });
      document.querySelectorAll(".lang button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
      document.getElementById("logo").src = lang === "ta" ? "img/logo-horizontal-ta.svg" : "img/logo-horizontal-en.svg";
      document.querySelectorAll("nav.tabs a").forEach((a) => { if (a.dataset.page === current) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
      document.querySelectorAll("[data-view]").forEach((v) => { v.hidden = v.dataset.view !== current; if (!v.hidden) v.innerHTML = views[current](); });
      head(current);
      document.getElementById("f-name").textContent = t(C.clinic.name);
      document.getElementById("f-tag").textContent = t(C.clinic.tagline);
      document.getElementById("f-date").textContent = C.updated;
      document.title = t(C.clinic.name) + " · " + u("nav_" + current) + " · Prototype";
    }

    document.querySelectorAll(".lang button").forEach((b) => b.addEventListener("click", () => {
      lang = b.dataset.lang;
      try { localStorage.setItem("roc-proto-lang", lang); } catch (e) {}
      render();
    }));
    window.addEventListener("hashchange", () => { render(); window.scrollTo(0, 0); });
    render();
  })();
  </script>
</body>
</html>
